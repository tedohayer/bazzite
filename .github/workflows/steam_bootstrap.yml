name: Publish Steam Bootstrap
on:
  schedule:
    - cron: "0 4 1 * *" # 4:00 utc on the 1st of every month
  push:
    branches:
      - testing
      - unstable
      - feat/steamrt64-bootstrap
    paths:
      - "build_files/tools/steam-bootstrap"
      - ".github/workflows/steam_bootstrap.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build bootstrap archive
        id: build
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/out"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/manifest" \
            https://client-update.steamstatic.com/steam_client_steamdeck_stable_steamrt64
          TMPDIR="${RUNNER_TEMP}" ./build_files/tools/steam-bootstrap \
            "${RUNNER_TEMP}/manifest" "${RUNNER_TEMP}/out/bootstrap_steam.tar.zst"
          version="$(sed -n 's/^\s*"version"\s*"\([0-9]*\)".*/\1/p' "${RUNNER_TEMP}/manifest" | head -n 1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/steam-bootstrap" >> "${GITHUB_OUTPUT}"

      - name: Build image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          printf 'FROM scratch\nCOPY bootstrap_steam.tar.zst /\n' > "${RUNNER_TEMP}/out/Containerfile"
          podman build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${IMAGE}:latest" --tag "${IMAGE}:${VERSION}" \
            "${RUNNER_TEMP}/out"

      - name: Push to GHCR
        id: push
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          VERSION: ${{ steps.build.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${ACTOR}" --password-stdin
          podman push --digestfile "${RUNNER_TEMP}/digest" "${IMAGE}:${VERSION}"
          podman push "${IMAGE}:latest"
          echo "digest=$(cat "${RUNNER_TEMP}/digest")" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image
        run: ./build.py sign --ref "${{ steps.build.outputs.image }}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
